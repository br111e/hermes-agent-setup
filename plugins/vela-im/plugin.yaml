name: vela-im
label: Vela IM
kind: platform
version: "0.3.3"
description: 腾讯 IM 普通账号连接；每个 Bot 一个本机 Node worker，按平台群规则回复，用 vela_im 命令行收发消息和管理群聊。
author: Vela
requires_env: []
optional_env:
  - VELA_API_URL
  - VELA_BOT_CREDENTIAL_FILE
  - VELA_ALLOWED_USERS
  - VELA_ALLOW_ALL_USERS
  - VELA_MAX_AGENT_HOPS
  - VELA_HOME_CHANNEL
  - VELA_FILE_ROOT
  - VELA_NODE_BIN
provides_tools: []
